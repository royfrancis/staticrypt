name: test

on:
  workflow_dispatch:
  push:
    branches:
      - bootstrap
      - develop
  pull_request:
    branches:
      - bootstrap
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        env:
          CI: true
        run: npm test -- --runInBand
