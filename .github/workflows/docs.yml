name: docs

on:
  push:
    branches:
      - bootstrap
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Encrypt docs example with StatiCrypt
        env:
          REGISTRY: ghcr.io
          ORG: royfrancis
          IMAGE: staticrypt:3.5.6
        run: |
          docker run --rm \
            --user $(id -u):$(id -g) \
            -v ${{ github.workspace }}:/home/work \
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE }} \
            docs/public/example.html \
            --directory docs/public \
            -p mylongpassword \
            --config false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress site
        run: npm run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
